name: Build LandOfTheDroid APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Native Library and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate or Install Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk/26.3.11579264" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          elif [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A $ANDROID_HOME/ndk 2>/dev/null)" ]; then
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          else
            echo "Installing NDK via sdkmanager..."
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK_DIR"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make

      - name: Compile Native Shared Library (libmain.so)
        run: |
          mkdir -p build_android
          cd build_android
          cmake -DCMAKE_TOOLCHAIN_FILE="${{ env.ANDROID_NDK_ROOT }}/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          cp libmain.so ../SDL3/android-project/app/libs/arm64-v8a/
          cd ..

      - name: Build Signed Release APK
        run: |
          cd SDL3/android-project
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ../..

      - name: Copy Release APK Artifact
        run: |
          cp SDL3/android-project/app/build/outputs/apk/release/app-release.apk LandOfTheDead-Android.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LandOfTheDead-Android
          path: LandOfTheDead-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release Asset (on Release Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LandOfTheDead-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
